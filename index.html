<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>เช็คระยะ</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="เช็คระยะ">
<meta name="theme-color" content="#FFFFFF">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap">
<style>
:root{
  --ink:#151B24; --muted:#4B5662; --accent:#2A5CAA; --next:#234C94;
  --line:#E3E6EA; --line2:#ECEEF1; --soft:#F1F3F5; --edge:#D4D9DE;
}
*{box-sizing:border-box}
html,body{margin:0;background:#fff}
body{color:var(--ink);font-family:'Sarabun',system-ui,-apple-system,sans-serif;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
button,input{font-family:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px calc(40px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px;min-height:100vh}
h1{margin:0;font-weight:700}
.muted{color:var(--muted)}
.topbar{display:flex;align-items:center;gap:8px}
.round{flex:none;width:44px;height:44px;display:flex;align-items:center;justify-content:center;border-radius:22px;border:1px solid var(--edge);background:#fff}
.list{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.carrow{width:100%;min-height:72px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border:none;border-bottom:1px solid var(--line2);background:transparent;text-align:left}
.cicon{flex:none;width:44px;height:44px;border-radius:22px;border:1px solid var(--edge);display:flex;align-items:center;justify-content:center;color:var(--next)}
.search{display:flex;align-items:center;gap:8px;min-height:44px;padding:0 14px;border-radius:12px;background:var(--soft);border:1px solid var(--line)}
.search input{flex:1;min-width:0;border:none;outline:none;background:transparent;font-size:16px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;-webkit-overflow-scrolling:touch}
.chip{flex:none;min-height:44px;padding:0 16px;border-radius:22px;border:1px solid var(--edge);background:#fff;font-size:15px;font-weight:500;white-space:nowrap}
.chip.on{border-color:var(--accent);background:var(--accent);color:#fff;font-weight:600}
.chip .n{font-variant-numeric:tabular-nums}
.chip:not(.on) .n{color:var(--muted)}
.head{padding:14px 0 6px;font-size:13.5px;line-height:1.5;font-weight:700;letter-spacing:.02em;color:var(--muted)}
.item{width:100%;min-height:64px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border:none;border-bottom:1px solid var(--line2);background:transparent;text-align:left}
.item .t{min-width:0;display:flex;flex-direction:column;gap:1px}
.item .nm{font-size:16px;line-height:1.4;font-weight:600;overflow-wrap:anywhere}
.item .sb{font-size:13.5px;line-height:1.45;color:var(--muted);overflow-wrap:anywhere}
.item .r{flex:none;display:flex;align-items:center;gap:8px}
.item .rr{display:flex;flex-direction:column;align-items:flex-end;gap:1px;font-variant-numeric:tabular-nums}
.item .mi{font-size:15px;line-height:1.4;font-weight:600}
.item .nx{font-size:13px;line-height:1.45;font-weight:600;color:var(--next)}
.item .ag{font-size:13px;line-height:1.45;color:var(--muted)}
.kvrow{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;min-height:52px;padding:13px 0;border-bottom:1px solid var(--line2)}
.kvrow .k{flex:none;font-size:15px;line-height:1.6;color:var(--muted)}
.kvrow .v{min-width:0;text-align:right;font-size:16px;line-height:1.6;font-weight:600;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.kvrow .v.missing{font-weight:400;color:var(--muted)}
.hist{min-height:60px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line2)}
.hist .d{font-size:16px;line-height:1.4;font-weight:600}
.hist .m{font-size:13.5px;line-height:1.45;color:var(--muted);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.hist .u{flex:none;font-size:14px;line-height:1.5;font-weight:600;font-variant-numeric:tabular-nums}
.photobox{min-height:160px;border-radius:12px;border:1px dashed var(--edge);background:var(--soft);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:14px;line-height:1.6;overflow:hidden}
.photobox img{display:block;width:100%;height:auto}
.empty{padding:32px 8px;text-align:center;color:var(--muted);font-size:15px;line-height:1.6}
.center{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;flex:1;color:var(--muted);font-size:15px;text-align:center;padding:48px 0}
.spin{width:28px;height:28px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--accent);animation:sp .9s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.retry{min-height:44px;padding:0 20px;border-radius:22px;border:1px solid var(--accent);background:var(--accent);color:#fff;font-size:15px;font-weight:600}

.fab{position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom));z-index:5;width:60px;height:60px;display:flex;align-items:center;justify-content:center;border:none;border-radius:30px;background:#234C94;color:#fff;box-shadow:0 6px 18px rgba(21,27,36,.28)}
.wtop{display:flex;align-items:center;gap:12px}
.bars{flex:1;display:flex;gap:6px}
.bars span{flex:1;height:5px;border-radius:3px;background:var(--line)}
.bars span.on{background:var(--accent)}
.plabel{flex:none;font-size:14px;line-height:1.5;color:var(--muted);font-variant-numeric:tabular-nums}
.wtitle{display:flex;flex-direction:column;gap:4px;padding:20px 0 14px}
.wtitle h1{font-size:28px;line-height:1.3}
.wtitle p{margin:0;font-size:15px;line-height:1.5;color:var(--muted)}
.wbody{flex:1;display:flex;flex-direction:column;gap:12px;padding-bottom:24px}
.wfoot{position:sticky;bottom:0;margin:0 -16px;padding:12px 16px calc(14px + env(safe-area-inset-bottom));background:#fff;border-top:1px solid var(--line);display:flex;gap:10px}
.btn{min-height:56px;border-radius:16px;border:1px solid var(--edge);background:#fff;font-size:17px;font-weight:600;padding:0 22px}
.btn.primary{flex:1;border:none;background:var(--accent);color:#fff;font-weight:700}
.btn.primary[disabled]{background:#C9D3E3;color:var(--muted)}
.ctx{font-size:14px;line-height:1.5;color:var(--muted)}
.lbl{font-size:15px;line-height:1.5;color:var(--muted)}
.bigin{width:100%;min-height:72px;padding:0 16px;border:2px solid var(--accent);border-radius:14px;outline:none;background:#fff;font-size:26px;font-weight:600}
.bigin.num{font-size:34px;font-weight:700;font-variant-numeric:tabular-nums}
.midin{width:100%;min-height:52px;padding:0 14px;border:1px solid var(--edge);border-radius:12px;outline:none;background:#fff;font-size:17px}
.qrow{width:100%;min-height:72px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border:none;border-bottom:1px solid var(--line2);background:transparent;text-align:left;font-size:20px;font-weight:600}
.dashed{width:100%;min-height:56px;display:flex;align-items:center;gap:10px;padding:8px 14px;border:1.5px dashed var(--accent);border-radius:12px;background:#F4F8FD;color:var(--next);font-size:16px;font-weight:600;text-align:left}
.pillbtn{min-height:48px;padding:0 16px;border-radius:24px;border:1px solid var(--edge);background:#fff;font-size:16px;font-weight:500}
.pillbtn.on{border-color:var(--accent);background:var(--accent);color:#fff;font-weight:600}
.warn{padding:10px 14px;border-radius:12px;background:#FFF1D6;color:#8A4B00;font-size:14.5px;line-height:1.6;font-weight:500}
.note2{padding:10px 14px;border-radius:12px;background:var(--soft);color:var(--muted);font-size:14px;line-height:1.6}
.rvrow{width:100%;min-height:56px;display:flex;align-items:flex-start;justify-content:space-between;gap:16px;padding:13px 0;border:none;border-bottom:1px solid var(--line2);background:transparent;text-align:left}
.rvrow .k{flex:none;font-size:15px;line-height:1.6;color:var(--muted)}
.rvrow .v{min-width:0;display:flex;align-items:center;gap:6px;text-align:right;font-size:16px;line-height:1.6;font-weight:600;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.rvrow .v.missing{font-weight:400;color:var(--muted)}
.fold{width:100%;min-height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;border:1px solid var(--edge);border-radius:12px;background:#fff;font-size:16px;font-weight:500}
.thumb{display:block;width:100%;max-height:220px;object-fit:cover;border-radius:12px}
.okc{width:76px;height:76px;border-radius:38px;background:#E4F1EA;color:#1F6B45;display:flex;align-items:center;justify-content:center}
.modal{position:fixed;inset:0;z-index:20;background:rgba(21,27,36,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;background:#fff;border-radius:20px 20px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px}
.sheet h2{margin:0;font-size:22px;line-height:1.3}
.errtxt{font-size:14.5px;line-height:1.6;color:#9B2C1F}
.due{align-self:flex-start;display:inline-block;margin-top:3px;padding:2px 8px;border-radius:6px;font-size:13px;line-height:1.45;font-weight:600}
.due.over{background:#FDECEA;color:#9B2C1F}
.due.soon{background:#FFF1D6;color:#8A4B00}
.duep{margin:2px 0 0;font-size:15px;line-height:1.5;font-weight:600}
.duep.over{color:#9B2C1F}
.duep.soon{color:#8A4B00}
.tbtn{margin-left:auto;flex:none;min-height:44px;padding:0 16px;border-radius:22px;border:1px solid var(--edge);background:#fff;font-size:15px;font-weight:600;color:var(--next)}
button.hist{width:100%;border:none;border-bottom:1px solid var(--line2);background:transparent;text-align:left}
.hist .hr{flex:none;display:flex;align-items:center;gap:8px}
.ef{display:flex;flex-direction:column;gap:6px}
.btn.danger{width:100%;flex:none;border-color:#E8B4AC;color:#9B2C1F;background:#fff}
.btn.dangerfill{flex:1;border:none;background:#B3261E;color:#fff;font-weight:700}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top));transform:translate(-50%,-160%);z-index:30;max-width:90%;padding:10px 18px;border-radius:22px;background:#151B24;color:#fff;font-size:15px;line-height:1.4;font-weight:600;box-shadow:0 6px 18px rgba(21,27,36,.28);transition:transform .25s ease}
.toast.show{transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){.spin{animation:none}.toast{transition:none}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<input type="file" id="pf" accept="image/*" hidden>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script src="config.js"></script>
<script>
(function () {
  var app = document.getElementById('app');
  var API = String(window.API_URL || '');
  var CACHE_KEY = 'cc_data_v1';
  var DATA = null;          // { cars: [...] }
  var stamp = 0;            // เวลาที่ข้อมูลล่าสุดถูกอัปเดต (ms)
  var status = 'loading';   // loading | ok | offline
  var inflight = false;
  var state = { screen: 'home', car: 0, item: 0, step: '', n: 0, edit: false, h: -1 };
  var filter = { q: '', cat: 'ทั้งหมด' };
  var listScroll = 0;
  var MONTHS = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];
  var CATS = ['ของเหลว', 'ช่วงล่าง', 'ล้อ/ยาง', 'เกียร์/เครื่อง', 'อื่น ๆ'];
  var DUE_CHIP = 'ถึงรอบเวลา';

  /* ---------- ตัวช่วย ---------- */
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function fmtDate(iso) {
    var p = iso.split('-').map(Number);
    return p[2] + ' ' + MONTHS[p[1] - 1] + ' ' + String(p[0] + 543).slice(-2);
  }
  function fmtNum(n) { return n ? Number(n).toLocaleString('en-US') : ''; }
  function age(iso) {
    var p = iso.split('-').map(Number);
    var y = p[0], m = p[1], d = p[2];
    var now = new Date();
    var today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    var months = (today.getFullYear() - y) * 12 + (today.getMonth() + 1 - m);
    if (today.getDate() < d) months--;
    if (months < 0) return '';
    var dim = new Date(y, m - 1 + months + 1, 0).getDate();
    var base = new Date(y, m - 1 + months, Math.min(d, dim));
    var days = Math.round((today - base) / 86400000);
    var yrs = Math.floor(months / 12), mo = months % 12;
    return (yrs > 0 ? yrs + ' ปี ' : '') + mo + ' เดือน ' + days + ' วัน';
  }
  function catOf(name) {
    if (/น้ำมัน|น้ำยา/.test(name)) return 'ของเหลว';
    if (/ลูกหมาก|ปีกนก|โช๊ค|โช้ค|แร็ค|คันชัก|เบ้า/.test(name)) return 'ช่วงล่าง';
    if (/แท่นเครื่อง/.test(name)) return 'เกียร์/เครื่อง';
    if (/^ล้อ|^ยาง|ยางรถ/.test(name)) return 'ล้อ/ยาง';
    if (/เกียร์|เครื่อง|วาล์ว|เฟือง|ปั๊ม|หัวเทียน|กรอง|สายพาน/.test(name)) return 'เกียร์/เครื่อง';
    return 'อื่น ๆ';
  }
  // รอบเปลี่ยนตามเวลา (เดือน) จากชีต Items คอลัมน์ C
  function monthsFor(name) {
    var std = (DATA && DATA.std) || [], key = String(name).toLowerCase();
    for (var i = 0; i < std.length; i++) if (std[i].n.toLowerCase() === key) return std[i].mo || 0;
    return 0;
  }
  // over = ครบหรือเกินรอบแล้ว, soon = ครบภายใน 30 วัน, ok = ยังไม่ถึง
  function dueInfo(it) {
    var mo = monthsFor(it.name);
    if (!mo || !it.date) return null;
    var p = it.date.split('-').map(Number);
    var dim = new Date(p[0], p[1] - 1 + mo + 1, 0).getDate();
    var due = new Date(p[0], p[1] - 1 + mo, Math.min(p[2], dim));
    var now = new Date(), today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    var days = Math.round((due - today) / 86400000);
    var level = days <= 0 ? 'over' : days <= 30 ? 'soon' : 'ok';
    var label = '';
    if (level === 'over') label = days === 0 ? 'ครบรอบเวลาวันนี้' : 'เกินรอบเวลา ' + age(isoOf(due)).replace(/^0 เดือน /, '');
    else if (level === 'soon') label = 'ครบรอบเวลาในอีก ' + days + ' วัน';
    return { mo: mo, due: isoOf(due), days: days, level: level, label: label };
  }
  function dueTag(d) { return d && d.level !== 'ok' ? '<span class="due ' + d.level + '">' + esc(d.label) + '</span>' : ''; }
  function isMoto(t) { return /มอเตอร์ไซค์|มอไซค์|มอเตอร์ไซด์|มอไซด์/.test(t || ''); }
  function pad2(n) { return (n < 10 ? '0' : '') + n; }
  function fmtStamp(ts) {
    var d = new Date(ts), now = new Date();
    var hm = pad2(d.getHours()) + ':' + pad2(d.getMinutes());
    if (d.toDateString() === now.toDateString()) return 'วันนี้ ' + hm;
    return d.getDate() + ' ' + MONTHS[d.getMonth()] + ' ' + hm;
  }

  var SVG_CAR = '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 17h14a1 1 0 0 0 1-1v-3.5L18 7H6l-2 5.5V16a1 1 0 0 0 1 1z"/><path d="M4 12.5h16"/><circle cx="8" cy="17" r="1.6"/><circle cx="16" cy="17" r="1.6"/></svg>';
  var SVG_MOTO = '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6.5" cy="17" r="2.5"/><circle cx="17.5" cy="17" r="2.5"/><path d="M3.5 14.5V12.5c0-1.4 1-2.5 2.5-2.5H9l1.5 4.5H17"/><path d="M17.5 17L15.5 6H12.5"/></svg>';
  var CHEV = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6B7580" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>';
  var BACK = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>';
  var REFRESH = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 6.1"/><path d="M20 4v7h-7"/></svg>';
  var MAG = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#4B5662" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>';

  /* ---------- หน้า 1: เลือกรถ ---------- */
  function statusText() {
    if (status === 'loading') return 'กำลังอัปเดต…';
    if (status === 'offline') return 'ออฟไลน์ · แสดงข้อมูลเมื่อ ' + (stamp ? fmtStamp(stamp) : '-');
    return 'อัปเดตแล้ว ' + fmtStamp(stamp);
  }
  function updateStatus() {
    var el = document.getElementById('status');
    if (el) el.textContent = statusText();
  }
  function homeHtml() {
    var h = '<div class="topbar" style="align-items:flex-start;justify-content:space-between;padding:8px 0 4px">' +
      '<div style="display:flex;flex-direction:column;gap:2px"><h1 style="font-size:30px;line-height:1.25">เช็คระยะ</h1>' +
      '<p class="muted" style="margin:0;font-size:15px;line-height:1.5">เลือกรถเพื่อดูรายการที่ยังใช้อยู่</p></div>' +
      '<button class="round" type="button" data-act="refresh" aria-label="โหลดข้อมูลใหม่">' + REFRESH + '</button></div>';
    h += '<div class="list">';
    DATA.cars.forEach(function (c, i) {
      var oldest = c.items[0];
      var summary = oldest ? 'เก่าสุด: ' + oldest.name + ' · ' + age(oldest.date) : 'ยังไม่มีรายการ';
      var nOver = 0, nSoon = 0;
      c.items.forEach(function (it) { var d = dueInfo(it); if (d && d.level === 'over') nOver++; else if (d && d.level === 'soon') nSoon++; });
      var warn = [];
      if (nOver) warn.push('เกินรอบเวลา ' + nOver + ' รายการ');
      if (nSoon) warn.push('ใกล้ครบ ' + nSoon + ' รายการ');
      h += '<button type="button" class="carrow" data-act="car" data-i="' + i + '">' +
        '<span style="min-width:0;display:flex;align-items:center;gap:12px">' +
        '<span class="cicon">' + (isMoto(c.type) ? SVG_MOTO : SVG_CAR) + '</span>' +
        '<span style="min-width:0;display:flex;flex-direction:column;gap:1px">' +
        '<span style="font-size:18px;line-height:1.4;font-weight:600">' + esc(c.name) +
        (c.type ? ' <span class="muted" style="font-size:13.5px;font-weight:400">' + esc(c.type) + '</span>' : '') + '</span>' +
        '<span class="muted" style="font-size:14px;line-height:1.5">' + esc(summary) + '</span>' +
        (warn.length ? '<span class="due ' + (nOver ? 'over' : 'soon') + '">' + esc(warn.join(' · ')) + '</span>' : '') + '</span></span>' +
        '<span style="flex:none;display:flex;align-items:center;gap:8px">' +
        '<span style="min-width:28px;font-size:18px;line-height:1.3;font-weight:700;text-align:right;font-variant-numeric:tabular-nums">' + c.items.length + '</span>' + CHEV + '</span></button>';
    });
    h += '</div><p class="muted" style="margin:4px 0 0;font-size:13.5px;line-height:1.6;text-align:center">ตัวเลขคือจำนวนรายการที่ยังใช้อยู่ (ไม่นับที่เปลี่ยนแล้ว)</p>' +
      '<p id="status" class="muted" style="margin:0;font-size:13px;line-height:1.6;text-align:center">' + esc(statusText()) + '</p>';

  }

  /* ---------- หน้า 2: รายการ (ค้นหา + ชิปกรอง + จัดกลุ่ม) ---------- */
  function full(c) {
    return c.items.map(function (it, i) { return { it: it, idx: i, cat: catOf(it.name), due: dueInfo(it) }; });
  }
  function matches(x) {
    var q = filter.q.trim().toLowerCase();
    if (filter.cat === DUE_CHIP) { if (!x.due || x.due.level === 'ok') return false; }
    else if (filter.cat !== 'ทั้งหมด' && x.cat !== filter.cat) return false;
    if (!q) return true;
    return x.it.name.toLowerCase().indexOf(q) >= 0 || (x.it.brand || '').toLowerCase().indexOf(q) >= 0;
  }
  function chipsHtml(c) {
    var all = full(c), counts = {};
    all.forEach(function (x) { counts[x.cat] = (counts[x.cat] || 0) + 1; });
    var nDue = all.filter(function (x) { return x.due && x.due.level !== 'ok'; }).length;
    var keys = [{ k: 'ทั้งหมด', n: all.length }].concat(nDue ? [{ k: DUE_CHIP, n: nDue }] : [], 
      CATS.filter(function (k) { return counts[k]; }).map(function (k) { return { k: k, n: counts[k] }; }));
    if (!keys.some(function (x) { return x.k === filter.cat; })) filter.cat = 'ทั้งหมด';
    return keys.map(function (x) {
      var on = x.k === filter.cat;
      return '<button type="button" class="chip' + (on ? ' on' : '') + '" data-act="chip" data-k="' + esc(x.k) + '" aria-pressed="' + on + '">' +
        esc(x.k) + ' <span class="n">' + x.n + '</span></button>';
    }).join('');
  }
  function rowHtml(x) {
    var it = x.it;
    return '<button type="button" class="item" data-act="item" data-i="' + x.idx + '">' +
      '<span class="t"><span class="nm">' + esc(it.name) + '</span>' +
      '<span class="sb">' + esc(fmtDate(it.date)) + (it.brand ? ' · ' + esc(it.brand) : '') + '</span>' + dueTag(x.due) + '</span>' +
      '<span class="r"><span class="rr"><span class="mi">' + fmtNum(it.mileage) + '</span>' +
      (it.next ? '<span class="nx">ถัดไป ' + fmtNum(it.next) + '</span>' : '<span class="ag">' + esc(age(it.date)) + '</span>') +
      '</span>' + CHEV + '</span></button>';
  }
  // ใหม่สุดอยู่บน: เรียงตามวันที่ แล้วเลขไมล์ แล้วลำดับที่บันทึก
  function newestFirst(a, b) {
    var da = String(a.it.date || ''), db = String(b.it.date || '');
    if (da !== db) return da < db ? 1 : -1;
    var ma = Number(a.it.mileage) || 0, mb = Number(b.it.mileage) || 0;
    if (ma !== mb) return mb - ma;
    return b.idx - a.idx;
  }
  function rowsHtml(c) {
    var all = full(c), shown = all.filter(matches);
    if (!shown.length) {
      return '<div class="empty">' + (all.length ? 'ไม่พบรายการที่ตรงกับคำค้น' : 'ยังไม่มีรายการของรถคันนี้') + '</div>';
    }
    return shown.sort(newestFirst).map(rowHtml).join('');
  }
  function listHtml() {
    var c = DATA.cars[state.car];
    if (!c) return homeHtml();
    var n = c.items.length;
    return '<div class="topbar"><button type="button" class="round" data-act="back" aria-label="กลับไปเลือกรถ">' + BACK + '</button>' +
      '<h1 style="font-size:24px;line-height:1.3">' + esc(c.name) + '</h1>' +
      '<span class="muted" style="font-size:14px;line-height:1.5">' + esc((c.type ? c.type + ' · ' : '') + n + ' รายการ') + '</span></div>' +
      '<label for="q" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">ค้นหารายการ</label>' +
      '<div class="search">' + MAG + '<input id="q" type="search" enterkeyhint="search" autocomplete="off" placeholder="ค้นหารายการหรือยี่ห้อ" value="' + esc(filter.q) + '"></div>' +
      '<div class="chips" id="chips">' + chipsHtml(c) + '</div>' +
      '<div class="muted" style="font-size:14px;line-height:1.5">' + (n ? 'ใหม่สุดอยู่บน · แตะแถวเพื่อดูรายละเอียด' : 'ยังไม่มีรายการของรถคันนี้') + '</div>' +
      '<div class="list" id="rows">' + rowsHtml(c) + '</div>' +
      '<div style="height:72px"></div>' +
      '<button type="button" class="fab" data-act="newentry" aria-label="บันทึกการเปลี่ยนอะไหล่">' + PLUS + '</button>';
  }

  /* ---------- หน้า 3: รายละเอียด ---------- */
  function kv(label, value, suffix) {
    var has = value !== '' && value != null && value !== 0;
    return '<div class="kvrow"><span class="k">' + esc(label) + '</span><span class="v' + (has ? '' : ' missing') + '">' +
      esc(has ? value + (suffix || '') : 'ไม่ได้บันทึก') + '</span></div>';
  }
  function itemHtml() {
    var c = DATA.cars[state.car];
    var it = c && c.items[state.item];
    if (!it) return homeHtml();
    var dd = dueInfo(it);
    var h = '<div class="topbar"><button type="button" class="round" data-act="back" aria-label="กลับไปรายการ">' + BACK + '</button>' +
      '<span class="muted" style="font-size:15px;line-height:1.5">' + esc(c.name + (c.type ? ' · ' + c.type : '')) + '</span>' +
      '<button type="button" class="tbtn" data-act="editrec" data-h="-1">แก้ไข</button></div>' +
      '<div style="display:flex;flex-direction:column;gap:2px;padding:4px 0 8px"><h1 style="font-size:26px;line-height:1.3;overflow-wrap:anywhere">' + esc(it.name) + '</h1>' +
      (it.next ? '<p style="margin:0;font-size:16px;line-height:1.5;font-weight:600;color:var(--next);font-variant-numeric:tabular-nums">ครั้งถัดไป ' + fmtNum(it.next) + ' กม.</p>' : '') +
      (dd && dd.level !== 'ok' ? '<p class="duep ' + dd.level + '">' + esc(dd.label) + '</p>' : '') + '</div>';
    h += '<div class="list">' +
      kv('วันที่เปลี่ยน', fmtDate(it.date)) +
      kv('เลขไมล์ที่เปลี่ยน', fmtNum(it.mileage), ' กม.') +
      kv('เลขไมล์ถัดไป', fmtNum(it.next), ' กม.') +
      kv('อายุการใช้งาน', age(it.date)) +
      (dd ? kv('รอบตามเวลา', 'ทุก ' + dd.mo + ' เดือน · ครบ ' + fmtDate(dd.due)) : '') +
      kv('ยี่ห้อ', it.brand) +
      kv('ราคา', it.price ? fmtNum(it.price) : '', ' บาท') +
      kv('ร้าน/อู่', it.shop) +
      kv('หมายเหตุ', it.reason) + '</div>';
    if (it.photo) {
      h += '<div style="display:flex;flex-direction:column;gap:8px;padding-top:6px"><div class="head" style="padding:0">รูปที่แนบ</div>' +
        '<div class="photobox" id="photo"><span>กำลังโหลดรูป…</span></div></div>';
    }
    h += '<div class="head" style="padding:14px 0 0">ประวัติการเปลี่ยน</div><div class="list">';
    if (it.history && it.history.length) {
      it.history.forEach(function (x, hi) {
        h += '<button type="button" class="hist" data-act="editrec" data-h="' + hi + '" aria-label="แก้ไขประวัติวันที่ ' + esc(fmtDate(x.date)) + '">' +
          '<span style="min-width:0;display:flex;flex-direction:column;gap:1px"><span class="d">' + esc(fmtDate(x.date)) + '</span>' +
          '<span class="m">' + fmtNum(x.mileage) + ' กม.' + (x.brand ? ' · ' + esc(x.brand) : '') + '</span></span>' +
          '<span class="hr">' + (x.used ? '<span class="u">ใช้ไป ' + fmtNum(x.used) + ' กม.</span>' : '') + CHEV + '</span></button>';
      });
    } else {
      h += '<div class="empty" style="text-align:left;padding:18px 0">ยังไม่มีประวัติก่อนหน้า</div>';
    }
    h += '</div>';
    if (it.history && it.history.length) h += '<p class="muted" style="margin:0;font-size:13.5px;line-height:1.6">แตะประวัติเพื่อแก้ไขหรือลบ</p>';
    h += '<div class="wfoot"><button type="button" class="btn primary" data-act="changeitem">เปลี่ยนรายการนี้</button></div>';
    return h;
  }

  function loadingHtml() {
    return '<div class="center" role="status"><div class="spin"></div><div>กำลังโหลดข้อมูล…</div></div>';
  }
  function errorHtml(msg) {
    return '<div class="center"><div>โหลดข้อมูลไม่สำเร็จ</div><div style="font-size:13px;max-width:320px;overflow-wrap:anywhere">' + esc(msg || '') + '</div>' +
      '<button type="button" class="retry" data-act="refresh">ลองอีกครั้ง</button></div>';
  }

  /* ---------- วาดหน้า ---------- */
  function view(st) {
    var prev = state.screen;
    if (st) state = norm(st);
    if (!DATA) return;
    var s = state.screen, html;
    if (s === 'list') html = listHtml();
    else if (s === 'item') html = itemHtml();
    else if (s === 'wizard') {
      html = wizardHtml();
      if (html == null) { state = norm({ screen: 'list', car: state.car }); html = listHtml(); }
    } else if (s === 'edit') {
      html = editHtml();
      if (html == null) { state = norm({ screen: 'list', car: state.car }); html = listHtml(); }
    } else if (s === 'done') html = doneHtml();
    else html = homeHtml();
    app.innerHTML = html;
    if (state.screen === 'list' && prev === 'item') window.scrollTo(0, listScroll);
    else window.scrollTo(0, 0);
    if (state.screen === 'item') loadPhoto();
    if (state.screen === 'wizard') afterWizard();
    syncFooter();
  }

  /* ---------- บันทึกการเปลี่ยนอะไหล่ (ถามทีละข้อ) ---------- */
  function stepsOf() { return entry && entry.fixedItem ? ['mileage', 'brand', 'note'] : ['item', 'mileage', 'brand', 'note']; }
  var entry = null, oq = '', saving = false, lastSaved = null;
  var pendingDone = false, pendingWizard = false;
  var PLUS = '<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>';

  function makeRid() { return 'r' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
  function newEntry(carIdx) {
    return { car: carIdx, item: '', mileage: '', brand: '', note: '', dateMode: 'today', customDate: '',
      price: '', shop: '', photo: '', photoUrl: '', showExtra: false, rid: makeRid() };
  }
  function eCar() { return entry && DATA ? DATA.cars[entry.car] : null; }
  function quickNames(c) { return isMoto(c.type) ? ['น้ำมันเครื่อง', 'น้ำมันเฟืองท้าย'] : ['น้ำมันเครื่อง', 'น้ำมันเกียร์']; }
  function findItem(c, name) {
    var key = String(name).toLowerCase();
    for (var i = 0; i < c.items.length; i++) if (c.items[i].name.toLowerCase() === key) return c.items[i];
    return null;
  }
  function cycleFor(c, name) {
    var std = (DATA && DATA.std) || [], key = String(name).toLowerCase();
    for (var i = 0; i < std.length; i++) {
      if (std[i].n.toLowerCase() === key) return isMoto(c.type) ? (std[i].mc || 0) : (std[i].c || 0);
    }
    return 0;
  }
  function nextFor() {
    var c = eCar(), m = Number(entry.mileage) || 0, cy = c ? cycleFor(c, entry.item) : 0;
    return m > 0 && cy > 0 ? m + cy : 0;
  }
  function isoOf(d) { return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
  function entryDate() {
    var now = new Date();
    if (entry.dateMode === 'custom' && entry.customDate) return entry.customDate;
    if (entry.dateMode === 'yesterday') now = new Date(now.getFullYear(), now.getMonth(), now.getDate() - 1);
    return isoOf(now);
  }

  // iOS ไม่ย่อหน้าเว็บตอนแป้นพิมพ์ขึ้น แถบปุ่มล่างจึงถูกแป้นบัง: วัดส่วนที่ถูกบังแล้วยกแถบขึ้นเท่ากัน
  function syncFooter() {
    var f = document.querySelector('.wfoot');
    if (!f) return;
    var vv = window.visualViewport;
    var kb = vv ? Math.max(0, Math.round(window.innerHeight - vv.height - vv.offsetTop)) : 0;
    // iPhone มีแถบ ^ v ✓ คั่นเหนือแป้นพิมพ์ซึ่งไม่นับรวมในส่วนที่วัดได้ จึงเผื่อเพิ่ม
    var ios = /iPhone|iPad|iPod/.test(String((window.navigator && window.navigator.userAgent) || ''));
    f.style.bottom = (kb + (kb > 0 && ios ? 52 : 0)) + 'px';
  }

  function wtop(step) {
    var steps = stepsOf(), idx = steps.indexOf(step), bars = '';
    steps.forEach(function (s, i) { bars += '<span' + ((step === 'review' || i <= idx) ? ' class="on"' : '') + '></span>'; });
    var label = step === 'review' ? 'ตรวจสอบ' : 'ข้อ ' + (idx + 1) + ' จาก ' + steps.length;
    return '<div class="wtop"><button type="button" class="round" data-act="back" aria-label="ย้อนกลับ">' + BACK + '</button>' +
      '<div class="bars" aria-hidden="true">' + bars + '</div><span class="plabel">' + label + '</span></div>';
  }
  function wtitle(t, sub) { return '<div class="wtitle"><h1>' + esc(t) + '</h1><p>' + esc(sub) + '</p></div>'; }
  function ctxLine() {
    var c = eCar();
    return '<div class="ctx">' + esc((c ? c.name : '') + (entry.item ? ' · ' + entry.item : '')) + '</div>';
  }

  function newBtnHtml() {
    var c = eCar(), t = oq.trim();
    if (!c || !t) return '';
    var dup = quickNames(c).some(function (n) { return n.toLowerCase() === t.toLowerCase(); });
    return dup ? '' : '<button type="button" class="dashed" data-act="pickother">+ ใช้ชื่อ “' + esc(t) + '”</button>';
  }
  function stepItemHtml() {
    var c = eCar();

    }).join('');

      '<div class="wbody"><div class="list">' + rows + '</div>' +
      '<div style="display:flex;flex-direction:column;gap:8px;padding-top:12px"><label class="lbl" for="oi">รายการอื่น (พิมพ์ชื่อ)</label>' +
      '<input id="oi" class="midin" type="text" enterkeyhint="next" autocomplete="off" placeholder="เช่น ปีกนก" value="' + esc(oq) + '">' +
      '<div id="newwrap">' + newBtnHtml() + '</div></div></div>';
  }

  function stepMileageHtml() {

      '<input id="mi" class="bigin num" type="text" inputmode="numeric" autocomplete="off" placeholder="0" value="' + esc(entry.mileage) + '">' +
      '<div class="ctx" style="font-size:14.5px;line-height:1.6">' + esc(hint) + '</div><div id="mwarn"></div><div id="mnext"></div>' +
      '<button type="button" id="wnext" class="btn primary" style="width:100%;flex:none;margin-top:6px" data-act="next"' + (ok ? '' : ' disabled') + '>ถัดไป</button></div>';
  }
  function updateMileageUI() {

  function stepBrandHtml() {

  function stepNoteHtml() {

  function rvFixed(label, value, muted) {

      '<span class="v' + (value ? '' : ' missing') + '">' + esc(value || 'ไม่ระบุ') + CHEV + '</span></button>';

  function stepReviewHtml() {
    var c = eCar(), m = Number(entry.mileage) || 0, nx = nextFor(), last = findItem(c, entry.item), iso = entryDate();
    var dopts = [['today', 'วันนี้'], ['yesterday', 'เมื่อวาน'], ['custom', 'เลือกวัน']].map(function (o) {

    h += '<div class="list">' + rvFixed('รถ', c.name) + rvFixed('รายการ', entry.item) +
      rvEdit('เลขไมล์ที่เปลี่ยน', m ? fmtNum(m) + ' กม.' : '', 'mileage') +
      (nx ? rvFixed('ครั้งถัดไป', fmtNum(nx) + ' กม. (คำนวณให้)') : rvFixed('ครั้งถัดไป', 'ไม่มีรอบมาตรฐาน', true)) +
      rvEdit('ยี่ห้อ', entry.brand, 'brand') + rvEdit('หมายเหตุ', entry.note, 'note') + '</div>';
    h += '<div style="display:flex;flex-direction:column;gap:8px;padding-top:6px"><div class="lbl">วันที่เปลี่ยน</div>' +
      '<div style="display:flex;flex-wrap:wrap;gap:8px">' + dopts + '</div>';

  /* ---------- รหัสลับ (เก็บในเครื่องนี้เท่านั้น ไม่อยู่ในโค้ดบน GitHub) ---------- */
  function getToken() { try { return localStorage.getItem('cc_token') || ''; } catch (e) { return ''; } }
  function setToken(t) { try { localStorage.setItem('cc_token', t); } catch (e) {} }
  function openTokenModal(cb, msg) {
    var m = document.createElement('div');
    m.className = 'modal';
    m.innerHTML = '<div class="sheet" role="dialog" aria-modal="true" aria-label="ใส่รหัสลับ"><h2>ใส่รหัสลับ (ครั้งเดียว)</h2>' +
      '<p class="muted" style="margin:0;font-size:15px;line-height:1.6">รหัสเดียวกับที่ใช้ใน Shortcut ใช้ยืนยันว่าคุณเป็นคนบันทึก เก็บไว้ในเครื่องนี้เท่านั้น</p>' +
      (msg ? '<div class="errtxt" role="alert">' + esc(msg) + '</div>' : '') +
      '<input id="tk" class="midin" type="text" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="วางรหัสที่นี่">' +
      '<div style="display:flex;gap:10px"><button type="button" class="btn" data-tk="cancel">ยกเลิก</button>' +
      '<button type="button" class="btn primary" data-tk="ok">ตกลง</button></div></div>';
    document.body.appendChild(m);
    m.addEventListener('click', function (ev) {
      var k = ev.target.closest('[data-tk]');
      if (!k) return;

      var v = document.getElementById('tk').value.trim();
      if (!v) return;
      setToken(v);
      document.body.removeChild(m);
      cb();
    });
    setTimeout(function () { var i = document.getElementById('tk'); if (i) { try { i.focus(); } catch (e) {} } }, 60);
  }

  /* ---------- รูป: ย่อเหลือด้านยาว 1200 พิกเซลก่อนส่ง ---------- */
  function processPhoto(file, cb) {
    var url = URL.createObjectURL(file), img = new Image();
    img.onload = function () {
      var max = 1200, w = img.naturalWidth, h = img.naturalHeight, sc = Math.min(1, max / Math.max(w, h));
      var cv = document.createElement('canvas');
      cv.width = Math.round(w * sc); cv.height = Math.round(h * sc);
      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
      URL.revokeObjectURL(url);
      cb(cv.toDataURL('image/jpeg', 0.8));
    };
    img.onerror = function () { URL.revokeObjectURL(url); cb(null); };
    img.src = url;
  }

  /* ---------- บันทึก ---------- */
  function showErr(msg) {

  function save() {
    if (saving || !entry) return;
    if (!API || /PASTE_YOUR/.test(API)) { showErr('ยังไม่ได้ใส่ลิงก์ Web app ในไฟล์ config.js'); return; }
    if (!getToken()) { openTokenModal(doSave); return; }

  function doSave() {
    var c = eCar();
    if (!c || saving) return;
    setSaving(true);
    var e0 = document.getElementById('saveerr'); if (e0) e0.innerHTML = '';
    var snap = {
      carIdx: entry.car, carName: c.name, item: entry.item.trim(), date: entryDate(), mileage: Number(entry.mileage) || 0,
      next: nextFor(), brand: entry.brand.trim(), note: entry.note.trim(), price: entry.price, shop: entry.shop.trim(), hasPhoto: !!entry.photo
    };
    var body = JSON.stringify({
      token: getToken(), rid: entry.rid, car: snap.carName, date: snap.date, item: snap.item, mileage: snap.mileage,
      note: snap.brand, reason: snap.note, price: snap.price, shop: snap.shop, image: entry.photo
    });
    // ส่งเป็นข้อความธรรมดา (ไม่ตั้ง header) เพื่อไม่ให้เบราว์เซอร์ต้องถามสิทธิ์ข้ามโดเมนก่อน
    fetch(API, { method: 'POST', body: body }).then(function (r) { return r.text(); }).then(function (t) {
      var j;
      try { j = JSON.parse(t); } catch (e) { throw new Error('ตอบกลับไม่ใช่ข้อมูลที่อ่านได้'); }
      if (!j.ok) { var er = new Error(j.message || 'บันทึกไม่สำเร็จ'); er.server = true; throw er; }
      saved(snap);
    }).catch(function (err) {
      setSaving(false);
      if (err && err.server) {
        if (/token/i.test(err.message)) { setToken(''); openTokenModal(doSave, 'รหัสลับไม่ถูกต้อง ใส่ใหม่อีกครั้ง'); }
        else showErr(err.message);
      } else {
        showErr('ไม่แน่ใจว่าบันทึกสำเร็จหรือไม่ (สัญญาณหรือการตอบกลับมีปัญหา) กดบันทึกอีกครั้งได้ ระบบกันบันทึกซ้ำให้');
      }
    });
  }
  // แสดงผลทันทีในแอป (ไม่ต้องรอ) แล้วค่อยดึงข้อมูลจริงมาทับ
  function applyLocal(e) {
    var c = DATA && DATA.cars[e.carIdx];
    if (!c) return;
    var rec = { name: e.item, date: e.date, mileage: e.mileage, next: e.next || 0, brand: e.brand,
      price: e.price ? Number(e.price) : '', shop: e.shop, reason: e.note, photo: '', history: [] };
    var old = findItem(c, e.item);
    if (!old) {
      c.items.push(rec);
    } else if (old.date <= rec.date) {
      rec.history = [{ date: old.date, mileage: old.mileage, brand: old.brand, used: rec.mileage > old.mileage ? rec.mileage - old.mileage : 0 }].concat(old.history || []);
      c.items[c.items.indexOf(old)] = rec;
    } else {
      old.history = (old.history || []).concat([{ date: rec.date, mileage: rec.mileage, brand: rec.brand, used: 0 }])
        .sort(function (a, b) { return a.date < b.date ? 1 : a.date > b.date ? -1 : 0; });
    }
    c.items.sort(function (a, b) { return a.date < b.date ? -1 : a.date > b.date ? 1 : 0; });

    writeCache();

  function editSubmit(action) {

      if (!/^\d{4}-\d{2}-\d{2}$/.test(e.date)) { editErr('เลือกวันที่เปลี่ยน'); return; }
    }
    if (!getToken()) { openTokenModal(function () { editSubmit(action); }); return; }
    editErr('');
    editBusy(true, action);
    var body = { token: getToken(), action: action, rid: action === 'delete' ? e.ridDel : e.rid, row: e.row, orig: e.orig };
    if (action === 'update') {

      if (!j.ok) { var er = new Error(String(j.message || 'ไม่สำเร็จ').replace(/^ผิดพลาด:\s*/, '')); er.server = true; throw er; }
      editDone(j, action, e);
    }).catch(function (err) {

        else editErr(err.message);
      } else {
        editErr('ไม่แน่ใจว่าสำเร็จหรือไม่ (สัญญาณหรือการตอบกลับมีปัญหา) กดอีกครั้งได้ ระบบกันทำซ้ำให้');
      }
    });
  }
  function editDone(j, action, e) {
    if (j.cars) {
      DATA = { cars: j.cars, std: j.std || (DATA && DATA.std) || [] };
      stamp = Date.now();
      status = 'ok';
      writeCache();
    } else {
      refresh();
    }
    var c = DATA.cars[e.car], idx = -1, key = e.name.toLowerCase();
    (c ? c.items : []).forEach(function (it, i) { if (it.name.toLowerCase() === key) idx = i; });
    editing = null;
    var mine = pendingEdit = { car: e.car, item: idx, msg: action === 'delete' ? 'ลบแล้ว' : 'แก้ไขแล้ว' };
    window.history.back();
    // กันกรณีเบราว์เซอร์ไม่ส่งเหตุการณ์ย้อนกลับ (เฉพาะการแก้ไขครั้งนี้เท่านั้น)
    setTimeout(function () { if (pendingEdit === mine) finishEdit(history.state); }, 900);
  }
  // เรียกเมื่อย้อนกลับจากหน้าแก้ไขแล้ว: ไปหน้ารายละเอียดของรายการเดิม (ลำดับอาจเปลี่ยน) ถ้ารายการหายไป ไปหน้ารถ
  function finishEdit(st) {
    var p = pendingEdit;
    if (!p) return false;
    if (p.item >= 0) {
      pendingEdit = null;
      var s2 = { screen: 'item', car: p.car, item: p.item };
      try { history.replaceState(norm(s2), '', location.href); } catch (x) {}
      view(s2);
      toast(p.msg);
      return true;
    }
    if (st && st.screen === 'item') { window.history.back(); return true; }
    pendingEdit = null;
    view(st && st.screen === 'list' ? st : { screen: 'list', car: p.car });
    toast(p.msg);
    return true;
  }

  /* ---------- เครือข่าย ---------- */
  function fetchJson(url) {
    return fetch(url, { cache: 'no-store' }).then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.text();
    }).then(function (t) {
      try { return JSON.parse(t); }
      catch (e) { throw new Error('ตอบกลับไม่ใช่ข้อมูลที่อ่านได้ ตรวจลิงก์ใน config.js และสิทธิ์ Web app ต้องเป็น Anyone'); }
    });
  }
  function apiUrl(q) { return API + (API.indexOf('?') >= 0 ? '&' : '?') + q; }

  function loadPhoto() {
    var c = DATA.cars[state.car];
    var it = c && c.items[state.item];
    var box = document.getElementById('photo');
    if (!it || !it.photo || !box) return;
    var want = it.photo, nm = it.name;
    fetchJson(apiUrl('action=photo&id=' + encodeURIComponent(want))).then(function (j) {
      if (!j || !j.ok) throw new Error(j && j.message);
      var b = document.getElementById('photo');
      var cur = DATA && DATA.cars[state.car] && DATA.cars[state.car].items[state.item];
      if (!b || state.screen !== 'item' || !cur || cur.photo !== want) return;
      b.innerHTML = '<img alt="รูปอะไหล่ ' + esc(nm) + '" src="' + j.url + '">';
    }).catch(function () {
      var b = document.getElementById('photo');
      if (b) b.innerHTML = '<span>โหลดรูปไม่ได้</span>';
    });
  }

  function readCache() {
    try {
      var s = localStorage.getItem(CACHE_KEY);
      var o = s ? JSON.parse(s) : null;
      return o && o.d && o.d.cars ? o : null;
    } catch (e) { return null; }
  }
  function writeCache() {
    try { localStorage.setItem(CACHE_KEY, JSON.stringify({ t: stamp, d: DATA })); } catch (e) {}
  }

  function onData(j) {
    DATA = { cars: j.cars, std: j.std || (DATA && DATA.std) || [] };
    stamp = Date.now();
    status = 'ok';
    writeCache();
    if (state.screen === 'home') view(state);
    else if (state.screen === 'list' && DATA.cars[state.car]) {
      var c = DATA.cars[state.car];
      var chips = document.getElementById('chips'), rows = document.getElementById('rows');
      if (chips && rows) { chips.innerHTML = chipsHtml(c); rows.innerHTML = rowsHtml(c); }
    }
  }

  function refresh() {
    if (inflight) return;
    if (!API || /PASTE_YOUR/.test(API)) {
      app.innerHTML = errorHtml('ยังไม่ได้ใส่ลิงก์ Web app ในไฟล์ config.js');
      return;
    }
    inflight = true;
    status = 'loading';
    updateStatus();
    if (!DATA) app.innerHTML = loadingHtml();
    fetchJson(apiUrl('action=data')).then(function (j) {
      if (!j || !j.ok || !j.cars) throw new Error((j && j.message) || 'ข้อมูลไม่ถูกต้อง');
      onData(j);
    }).catch(function (err) {
      if (DATA) { status = 'offline'; updateStatus(); }
      else app.innerHTML = errorHtml(err && err.message);
    }).then(function () { inflight = false; });
  }

  /* ---------- นำทาง: ใช้ประวัติของเบราว์เซอร์ ปัดจากขอบซ้ายเพื่อย้อนกลับได้ ---------- */
  function norm(st) {
    st = st || {};
    return { screen: st.screen || 'home', car: st.car || 0, item: st.item || 0, step: st.step || '', n: st.n || 0, edit: !!st.edit,
      h: typeof st.h === 'number' ? st.h : -1 };
  }
  function go(st, hash) {
    view(st);
    try { history.pushState(norm(st), '', '#' + (hash || '')); } catch (e) {}
  }
  function back() {
    if (history.state && history.state.screen && history.state.screen !== 'home') { history.back(); return; }
    view(state.screen === 'item' ? { screen: 'list', car: state.car } : { screen: 'home' });
  }
  function rerender() {
    var y = window.pageYOffset || 0;
    view(null);
    window.scrollTo(0, y);
  }
  window.addEventListener('popstate', function (e) {
    var st = norm(e.state && e.state.screen ? e.state : null);
    if (pendingEdit && finishEdit(st)) return;
    if (pendingDone) { pendingDone = false; state = st; go({ screen: 'done', car: st.car }, 'done'); return; }
    if (pendingWizard) { pendingWizard = false; state = st; startWizard(st.car); return; }
    view(st);
  });

  app.addEventListener('click', function (ev) {
    var t = ev.target.closest('[data-act]');
    if (!t) return;
    var act = t.getAttribute('data-act');
    var i = Number(t.getAttribute('data-i'));
    if (act === 'car') {
      filter = { q: '', cat: 'ทั้งหมด' };
      go({ screen: 'list', car: i }, 'car' + i);
    } else if (act === 'item') {
      listScroll = window.pageYOffset || document.documentElement.scrollTop || 0;
      go({ screen: 'item', car: state.car, item: i }, 'item' + i);
    } else if (act === 'chip') {
      filter.cat = t.getAttribute('data-k');
      var c = DATA.cars[state.car];
      document.getElementById('chips').innerHTML = chipsHtml(c);
      document.getElementById('rows').innerHTML = rowsHtml(c);
    } else if (act === 'back') back();
    else if (act === 'refresh') refresh();
    else if (act === 'newentry') startWizard(state.car);
    else if (act === 'changeitem') startWizardForItem(state.car, state.item);
    else if (act === 'editrec') startEdit(Number(t.getAttribute('data-h')));
    else if (act === 'editsave') editSubmit('update');
    else if (act === 'editdel') confirmDelete();
    else if (act === 'pick') { entry.item = t.getAttribute('data-name'); oq = ''; nextStep('item'); }
    else if (act === 'pickother') { var nm = oq.trim(); if (nm) { entry.item = nm; oq = ''; nextStep('item'); } }
    else if (act === 'next') nextStep(state.step);
    else if (act === 'skip') { if (state.step === 'brand') entry.brand = ''; nextStep(state.step); }
    else if (act === 'qnote') { entry.note = t.getAttribute('data-v'); nextStep('note'); }
    else if (act === 'edit') wizGo(t.getAttribute('data-k'), true);
    else if (act === 'date') { entry.dateMode = t.getAttribute('data-k'); rerender(); }
    else if (act === 'extra') { entry.showExtra = !entry.showExtra; rerender(); }
    else if (act === 'photo') document.getElementById('pf').click();
    else if (act === 'photo-remove') { entry.photo = ''; entry.photoUrl = ''; rerender(); }
    else if (act === 'save') save();
    else if (act === 'again') again();
    else if (act === 'finish') back();
  });

  // พิมพ์ในช่อง: อัปเดตเฉพาะส่วนที่เกี่ยวข้อง ไม่วาดช่องใหม่ (เคอร์เซอร์จะไม่หลุด)
  app.addEventListener('input', function (ev) {
    var el = ev.target;
    if (!el || !DATA) return;
    var id = el.id;
    if (id === 'q' && state.screen === 'list') {
      filter.q = el.value;
      document.getElementById('rows').innerHTML = rowsHtml(DATA.cars[state.car]);
    } else if (state.screen === 'edit' && editing) {
      var map = { ed: 'date', em: 'mileage', eb: 'brand', er: 'reason', ep: 'price', es: 'shop' };
      if (!map[id]) return;
      var v = el.value;
      if (id === 'em' || id === 'ep') { v = v.replace(/[^0-9]/g, ''); if (v !== el.value) el.value = v; }
      editing[map[id]] = v;
      editing.rid = makeRid(); // ค่าเปลี่ยน = คำขอใหม่ (กดซ้ำโดยไม่แก้อะไร ใช้รหัสเดิม กันทำซ้ำ)
    } else if (state.screen === 'wizard' && entry) {
      if (id === 'oi') { oq = el.value; var w = document.getElementById('newwrap'); if (w) w.innerHTML = newBtnHtml(); }
      else if (id === 'mi') { var d = el.value.replace(/[^0-9]/g, ''); if (d !== el.value) el.value = d; entry.mileage = d; updateMileageUI(); }
      else if (id === 'br') { entry.brand = el.value; var b = document.getElementById('wnext'); if (b) b.disabled = !entry.brand.trim(); }
      else if (id === 'nt') entry.note = el.value;
      else if (id === 'pr') { var p = el.value.replace(/[^0-9]/g, ''); if (p !== el.value) el.value = p; entry.price = p; }
      else if (id === 'sh') entry.shop = el.value;
      else if (id === 'cd') entry.customDate = el.value;
    }
  });
  app.addEventListener('change', function (ev) {
    if (ev.target && ev.target.id === 'ed' && editing && editing.date !== ev.target.value) { editing.date = ev.target.value; editing.rid = makeRid(); }
    if (ev.target && ev.target.id === 'cd' && entry) entry.customDate = ev.target.value;
  });
  document.getElementById('pf').addEventListener('change', function (ev) {
    var inp = ev.target, f = inp.files && inp.files[0];
    if (!f || !entry) return;
    processPhoto(f, function (dataUrl) {
      inp.value = '';
      if (!dataUrl) { showErr('อ่านรูปนี้ไม่ได้ ลองรูปอื่น'); return; }
      entry.photoUrl = dataUrl;
      entry.photo = dataUrl.split(',')[1] || '';
      entry.showExtra = true;
      if (state.screen === 'wizard' && state.step === 'review') rerender();
    });
  });

  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', syncFooter);
    window.visualViewport.addEventListener('scroll', syncFooter);
  }
  document.addEventListener('focusin', function () { setTimeout(syncFooter, 300); });
  document.addEventListener('focusout', function () { setTimeout(syncFooter, 300); });

  // ปุ่ม Return บนแป้นพิมพ์ตัวอักษร = ถัดไป (แป้นตัวเลขของ iPhone ไม่มีปุ่ม Return จึงใช้แถบปุ่มที่ยกขึ้นเหนือแป้นแทน)
  app.addEventListener('keydown', function (ev) {
    if (ev.key === 'Enter' && state.screen === 'edit' && ev.target && ev.target.blur) { ev.preventDefault(); ev.target.blur(); return; }
    if (ev.key !== 'Enter' || state.screen !== 'wizard' || !entry) return;
    var id = ev.target && ev.target.id;
    if (id === 'br' && entry.brand.trim()) { ev.preventDefault(); ev.target.blur(); nextStep('brand'); }
    else if (id === 'nt') { ev.preventDefault(); ev.target.blur(); nextStep('note'); }
    else if (id === 'oi' && oq.trim()) { ev.preventDefault(); ev.target.blur(); entry.item = oq.trim(); oq = ''; nextStep('item'); }
  });

  // กลับมาเปิดแอปหลังพักไว้นาน: อัปเดตข้อมูลให้เอง
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden && Date.now() - stamp > 5 * 60 * 1000) refresh();
  });
  window.addEventListener('online', function () { refresh(); });

  /* ---------- เริ่มต้น ---------- */
  try { history.replaceState({ screen: 'home', car: 0, item: 0 }, '', location.pathname + location.search); } catch (e) {}
  var cached = readCache();
  if (cached) {
    DATA = cached.d;
    stamp = cached.t || 0;
    view({ screen: 'home' });
  } else {
    app.innerHTML = loadingHtml();
  }
  refresh();

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
  }
})();
</script>
</body>
</html>
